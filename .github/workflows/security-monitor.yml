# Giám sát bảo mật on-chain — chạy độc lập với Render (gói Free hay ngủ).
# Cần thêm Secrets tại: GitHub repo → Settings → Secrets and variables → Actions
#   RPC_URL, MONGODB_URI, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, DATA_ENCRYPTION_KEY
name: security-monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub có thể chạy trễ vài phút so với lịch
  workflow_dispatch: {}      # cho phép bấm chạy tay trong tab Actions

concurrency:
  group: security-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev
      - run: node scripts/monitor.js
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          MINT_ALERT_THRESHOLD: "20"
