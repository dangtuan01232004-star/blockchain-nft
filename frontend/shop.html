<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mua hàng — Con Dấu Số</title>
<link rel="stylesheet" href="css/styles.css">
<script src="js/config.js"></script>
</head>
<body class="app-theme">

<div class="topbar">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark">CD</span>
      Con Dấu Số
    </a>
    <div class="nav-links">
      <a href="shop.html">Mua hàng</a>
      <a href="verify.html">Xác thực sản phẩm</a>
      <a href="admin.html">Quản trị / Nhà sản xuất</a>
    </div>
  </div>
</div>

<div class="shop-shell">
  <div class="wrap">
    <h1 class="shop-title">Mua sản phẩm chính hãng</h1>
    <p class="section-sub">Mỗi sản phẩm gắn 1 NFT duy nhất — xác thực nguồn gốc rõ ràng trước khi đặt mua.</p>

    <div class="shop-search">
      <input type="text" id="searchInput" placeholder="Tìm theo tên sản phẩm hoặc mã SKU...">
      <button class="btn btn-primary" id="searchBtn">Tìm kiếm</button>
    </div>

    <div class="product-grid" id="shopGrid" style="margin-top:24px"></div>
    <p class="section-sub" id="shopHint" style="margin-top:16px"></p>
  </div>
</div>

<!-- Modal đặt hàng -->
<div class="modal-overlay" id="orderModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Đặt mua sản phẩm</h2>
      <button class="modal-close" data-close="orderModal" type="button">✕</button>
    </div>
    <p class="section-sub" id="orderProductLabel" style="margin-top:-8px; margin-bottom:16px"></p>
    <form id="orderForm">
      <div class="field">
        <label>Họ và tên người nhận</label>
        <input type="text" id="buyerName" required>
      </div>
      <div class="field">
        <label>Số điện thoại</label>
        <input type="tel" id="buyerPhone" placeholder="09xxxxxxxx" required>
      </div>
      <div class="field">
        <label>Địa chỉ nhận hàng</label>
        <textarea id="buyerAddress" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành..." required></textarea>
      </div>
      <div class="field">
        <label>Ghi chú (tuỳ chọn)</label>
        <textarea id="orderNote" placeholder="Ví dụ: giao giờ hành chính..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center">Xác nhận đặt hàng</button>
    </form>
    <div class="status-msg" id="orderStatus"></div>
  </div>
</div>

<footer>
  <div class="wrap">
    Đơn hàng không yêu cầu ví điện tử — chỉ nhà sản xuất/phân phối cần kết nối ví khi xử lý chuỗi cung ứng.
  </div>
</footer>

<script>
  const API_BASE = window.API_BASE || `http://${window.location.hostname}:4000`;
  let products = [];
  let selectedProduct = null;

  function openModal(id) { document.getElementById(id).classList.add("show"); }
  function closeModal(id) { document.getElementById(id).classList.remove("show"); }
  document.querySelectorAll("[data-close]").forEach((btn) => btn.addEventListener("click", () => closeModal(btn.dataset.close)));
  document.querySelectorAll(".modal-overlay").forEach((overlay) => {
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("show"); });
  });

  function renderGrid(list) {
    const grid = document.getElementById("shopGrid");
    const hint = document.getElementById("shopHint");
    grid.innerHTML = "";
    if (list.length === 0) {
      hint.textContent = "Không tìm thấy sản phẩm nào phù hợp.";
      return;
    }
    hint.textContent = `${list.length} sản phẩm`;
    list.forEach((p) => {
      const card = document.createElement("div");
      card.className = "product-card";
      card.innerHTML = `
        <div class="product-card-top">
          <span class="mono" style="font-size:0.8rem; color:var(--muted)">#${p.tokenId}</span>
          <span class="pill">Số lượng: ${p.quantity}</span>
        </div>
        <h3>${p.name || "(chưa đặt tên)"}</h3>
        <p class="product-card-meta">${p.productCode || ""}${p.manufacturer ? " · " + p.manufacturer : ""}</p>
        <div class="product-card-actions">
          <a class="btn btn-outline" href="${p.verifyUrl}" target="_blank" style="font-size:0.82rem; padding:8px 12px">🔍 Xác thực</a>
          <button class="btn btn-primary buy-btn" data-token="${p.tokenId}" style="font-size:0.82rem; padding:8px 12px">🛒 Mua ngay</button>
        </div>
      `;
      grid.appendChild(card);
    });
    grid.querySelectorAll(".buy-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedProduct = list.find((p) => p.tokenId === btn.dataset.token);
        document.getElementById("orderProductLabel").textContent =
          `Sản phẩm: ${selectedProduct.name} (#${selectedProduct.tokenId})`;
        openModal("orderModal");
      });
    });
  }

  async function loadAll() {
    try {
      const res = await fetch(`${API_BASE}/api/shop/products`);
      products = await res.json();
      renderGrid(products);
    } catch {
      document.getElementById("shopHint").textContent = "Không tải được danh sách sản phẩm — kiểm tra backend đã chạy chưa.";
    }
  }

  async function doSearch() {
    const q = document.getElementById("searchInput").value.trim();
    try {
      const res = await fetch(`${API_BASE}/api/shop/search?q=${encodeURIComponent(q)}`);
      const list = await res.json();
      renderGrid(list);
    } catch {
      document.getElementById("shopHint").textContent = "Lỗi khi tìm kiếm.";
    }
  }
  document.getElementById("searchBtn").addEventListener("click", doSearch);
  document.getElementById("searchInput").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });

  document.getElementById("orderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById("orderStatus");
    const payload = {
      tokenId: selectedProduct.tokenId,
      productName: selectedProduct.name,
      productCode: selectedProduct.productCode,
      buyerName: document.getElementById("buyerName").value,
      buyerPhone: document.getElementById("buyerPhone").value,
      buyerAddress: document.getElementById("buyerAddress").value,
      note: document.getElementById("orderNote").value,
    };
    try {
      const res = await fetch(`${API_BASE}/api/shop/orders`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Lỗi khi đặt hàng");
      statusEl.textContent = "Đặt hàng thành công! Bên bán sẽ liên hệ để xác nhận giao hàng.";
      statusEl.className = "status-msg show ok";
      document.getElementById("orderForm").reset();
      setTimeout(() => closeModal("orderModal"), 1800);
    } catch (err) {
      statusEl.textContent = "Lỗi: " + err.message;
      statusEl.className = "status-msg show err";
    }
  });

  loadAll();
</script>

</body>
</html>
